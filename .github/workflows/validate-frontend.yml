name: Validate frontend

on:
  pull_request:
    paths:
      - "app/**"
      - "deploy/**"
      - "scripts/**"
      - "tests/**"
      - ".env.example"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-frontend.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "deploy/**"
      - "scripts/**"
      - "tests/**"
      - ".env.example"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-frontend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
      - run: npm ci
      - run: npm run check
