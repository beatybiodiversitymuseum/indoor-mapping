  <rect x="70" y="40" width="960" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="96" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#24292f">New issue: Add or correct an Amenity or Opening</text>
  <rect x="96" y="122" width="908" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="116" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#24292f">Location name</text>
  <text x="116" y="174" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#57606a">Example: Fire Extinguisher</text>
  <line x1="96" y1="224" x2="1004" y2="224" stroke="#d8dee4"/>
  <text x="96" y="258" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#24292f">Optional: pasted GeoJSON feature</text>
  <text x="96" y="286" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#57606a">Paste the selected Point feature copied from the lower Feature Editor &gt; GeoJSON tab.</text>
  <rect x="96" y="310" width="908" height="230" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="120" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">```json</text>
  <text x="120" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">{</text>
  <text x="140" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">"type": "Feature",</text>
  <text x="140" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">"properties": {},</text>
  <text x="140" y="434" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">"geometry": { "type": "Point", "coordinates": [ -123.2507034, 49.2633799 ] }</text>
  <text x="120" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">}</text>
  <text x="120" y="482" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#24292f">```</text>
