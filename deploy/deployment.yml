---
schema_version: 1
application:
  name: indoor-mapping
deployment:
  interface: service_creator_v1
  install: deploy/controller/install.sh
  readiness: deploy/controller/readiness.sh
  default_root: /var/www/apps/indoor-mapping

  build: deploy/controller/build.sh
  artifact_root: .deploy-artifact

  defaults_file: deploy/defaults.env
  environment_file: /etc/indoor-mapping/service.env

  allocation_env:
    bind_host: APP_HOST
    app_port: APP_PORT

  ingress:
    type: nginx_proxy
    path_env: APP_BASE_PATH
